name: Regression Build and Test

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.5"

      - name: Build
        run: cargo build --verbose

      - name: Regenerate sources and check for uncommitted changes
        run: cargo xtask generate check-dirty

      - name: Run tests
        run: cargo test --verbose
